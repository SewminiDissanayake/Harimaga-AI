<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc">
<title id="title">HariMaga AI Sri Lanka road logo</title>
<desc id="desc">Sri Lanka represented as green land within the blue Indian Ocean, crossed by a golden guiding road leading to a maroon destination pin.</desc>
