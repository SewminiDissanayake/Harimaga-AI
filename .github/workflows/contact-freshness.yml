# On the 1st of every month, checks whether the official contact data is
# older than 6 months. If it is, this workflow fails and GitHub emails you.
name: Contact data freshness

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_contact_freshness.py --days 180
